server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    # Form registrasi dapat membawa tiga file (maksimal 2 MB per file).
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 180s;
    }

    location ^~ /db/ {
        deny all;
    }

    # Upload hanya boleh dilayani sebagai file statis. Modifier ^~ mencegah
    # file berekstensi PHP di folder ini masuk ke handler PHP-FPM.
    location ^~ /uploads/ {
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
