services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-obibase}
      MARIADB_USER: ${DB_USER:-obi}
      MARIADB_PASSWORD: ${DB_PASSWORD:-obi_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Jakarta
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obibase}
      DB_USER: ${DB_USER:-obi}
      DB_PASS: ${DB_PASSWORD:-obi_secret}
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obibase}
      DB_USER: ${DB_USER:-obi}
      DB_PASS: ${DB_PASSWORD:-obi_secret}
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www/html
    command: ["php", "db/migrate_exam.php"]
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mariadb_data:
