services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-obibase}
      MARIADB_USER: ${DB_USER:-obi}
      MARIADB_PASSWORD: ${DB_PASSWORD:-obi_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Jakarta
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      database:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obibase}
      DB_USER: ${DB_USER:-obi}
      DB_PASS: ${DB_PASSWORD:-obi_secret}
      CBT_ALLOWED_ORIGINS: ${CBT_ALLOWED_ORIGINS:-https://exam.sewantara.id}
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-obibase}
      DB_USER: ${DB_USER:-obi}
      DB_PASS: ${DB_PASSWORD:-obi_secret}
      TZ: Asia/Jakarta
    volumes:
      - ./:/var/www/html
    command: ["php", "db/migrate_exam.php"]
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../obi-fe
      dockerfile: Dockerfile
    image: obi-cbt-frontend:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_CBT_API_BASE_URL: ${PUBLIC_CBT_API_BASE_URL:-https://obi.sewantara.id/_/api.php}
      ORIGIN: ${ORIGIN:-https://exam.sewantara.id}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  mariadb_data:
